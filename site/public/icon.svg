<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Matchday">
  <defs>
    <linearGradient id="pitch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d3b26"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="40" fill="url(#pitch)"/>

  <!-- ball mark, recentered and scaled up from docs/assets/banner.svg's
       identical group so both stay visually identical if either is
       redrawn later. -->
  <g transform="translate(100,100) scale(1.35)">
    <circle r="62" fill="#ffffff"/>
    <circle r="62" fill="none" stroke="#0d3b26" stroke-width="3"/>
    <polygon points="0,-22 20.9,-6.8 12.9,17.8 -12.9,17.8 -20.9,-6.8" fill="#14532d"/>
    <g stroke="#14532d" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-22" x2="0" y2="-50"/>
      <line x1="20.9" y1="-6.8" x2="47.6" y2="-15.5"/>
      <line x1="12.9" y1="17.8" x2="29.4" y2="40.5"/>
      <line x1="-12.9" y1="17.8" x2="-29.4" y2="40.5"/>
      <line x1="-20.9" y1="-6.8" x2="-47.6" y2="-15.5"/>
    </g>
    <g fill="#14532d">
      <polygon points="-6,-9 6,-9 9,0 0,8 -9,0" transform="rotate(-54) translate(0,-50)"/>
      <polygon points="-6,-9 6,-9 9,0 0,8 -9,0" transform="rotate(18) translate(0,-50)"/>
      <polygon points="-6,-9 6,-9 9,0 0,8 -9,0" transform="rotate(90) translate(0,-50)"/>
      <polygon points="-6,-9 6,-9 9,0 0,8 -9,0" transform="rotate(162) translate(0,-50)"/>
      <polygon points="-6,-9 6,-9 9,0 0,8 -9,0" transform="rotate(234) translate(0,-50)"/>
    </g>
  </g>
</svg>

services:
  postgres:
    image: postgres:15
    container_name: matchday_gateway_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: matchday_gateway_dev
      POSTGRES_USER: gateway_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5433:5432"
    volumes:
      - gateway_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_user -d matchday_gateway_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: matchday_gateway_api_dev
    restart: unless-stopped
    ports:
      - "8010:8010"
    env_file:
      - .env.local
    environment:
      # Local development runs without auth. The gateway fails closed
      # otherwise - with no keys configured and no explicit opt-out it
      # refuses every request, so a deployment that forgets to set
      # GATEWAY_API_KEYS cannot quietly serve itself to anyone who finds
      # it. This line is what makes that safe default painless here, and
      # it is deliberately not in .env.example.
      GATEWAY_ALLOW_ANONYMOUS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - gateway-network
      # Joins predify's own network so predify's api container can reach
      # this gateway at http://matchday_gateway_api_dev:8010 instead of
      # going through localhost/host networking.
      - predify-network

networks:
  gateway-network:
    driver: bridge
  predify-network:
    external: true
    name: predify_predify-network

volumes:
  gateway_postgres_dev_data:

[project]
name = "matchday-gateway"
version = "0.1.0"
description = "Self-hosted football (soccer) data gateway - aggregates leagues, teams, fixtures and scores from pluggable upstream connectors and serves them through a stable REST API."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.5",
    "apscheduler>=3.11.0",
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.116.1",
    "httpx>=0.28.1",
    "psycopg[pool]>=3.2.9",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "sqlmodel>=0.0.24",
    "uuid6>=2025.0.1",
]

# Optional - only needed for the Sofascore backfill fallback
# (app/connectors/soccerdata_sofascore.py). Not a base dependency: it pulls
# in a compiled TLS-fingerprint-spoofing binary (bogdanfinn/tls-client via
# the `tls_requests` package) used to get past Sofascore's bot detection.
# Install with `uv sync --extra soccerdata` only if you're knowingly
# enabling ENABLE_SOCCERDATA_FALLBACK - see README.
[project.optional-dependencies]
soccerdata = ["soccerdata>=1.9.1"]

[dependency-groups]
dev = ["pytest>=8.4.1", "pytest-asyncio>=0.24.0", "ruff>=0.12.11", "aiosqlite>=0.20.0"]

[tool.ruff]
line-length = 90
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
"**/alembic/env.py" = ["F403", "F401"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E712"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]

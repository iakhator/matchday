<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Matchday">
  <defs>
    <linearGradient id="pitch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d3b26"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#pitch)"/>

  <!-- mown-pitch stripes -->
  <g fill="url(#stripe)">
    <rect x="0"    y="0" width="100" height="320"/>
    <rect x="200"  y="0" width="100" height="320"/>
    <rect x="400"  y="0" width="100" height="320"/>
    <rect x="600"  y="0" width="100" height="320"/>
    <rect x="800"  y="0" width="100" height="320"/>
    <rect x="1000" y="0" width="100" height="320"/>
  </g>

  <!-- pitch markings -->
  <g stroke="#ffffff" stroke-opacity="0.18" fill="none" stroke-width="2">
    <line x1="600" y1="0" x2="600" y2="320"/>
    <circle cx="600" cy="160" r="70"/>
    <circle cx="600" cy="160" r="3" fill="#ffffff" fill-opacity="0.18" stroke="none"/>
    <rect x="0" y="70" width="60" height="180"/>
    <rect x="1140" y="70" width="60" height="180"/>
  </g>

  <!-- ball mark -->
  <g transform="translate(150,160)">
    <circle r="62" fill="#ffffff"/>
    <circle r="62" fill="none" stroke="#0d3b26" stroke-width="3"/>
    <polygon points="0,-22 20.9,-6.8 12.9,17.8 -12.9,17.8 -20.9,-6.8" fill="#14532d"/>
    <g stroke="#14532d" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-22" x2="0" y2="-50"/>
      <line x1="20.9" y1="-6.8" x2="47.6" y2="-15.5"/>
      <line x1="12.9" y1="17.8" x2="29.4" y2="40.5"/>
      <line x1="-12.9" y1="17.8" x2="-29.4" y2="40.5"/>
      <line x1="-20.9" y1="-6.8" x2="-47.6" y2="-15.5"/>
    </g>
    <g fill="#14532d">
      <polygon points="-6,-9 6,-9 9,0 0,8 -9,0" transform="rotate(-54) translate(0,-50)"/>
      <polygon points="-6,-9 6,-9 9,0 0,8 -9,0" transform="rotate(18) translate(0,-50)"/>
      <polygon points="-6,-9 6,-9 9,0 0,8 -9,0" transform="rotate(90) translate(0,-50)"/>
      <polygon points="-6,-9 6,-9 9,0 0,8 -9,0" transform="rotate(162) translate(0,-50)"/>
      <polygon points="-6,-9 6,-9 9,0 0,8 -9,0" transform="rotate(234) translate(0,-50)"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="255" y="182" font-family="Helvetica, Arial, sans-serif" font-size="88" font-weight="700" fill="#ffffff" letter-spacing="2">MATCHDAY</text>

  <!-- tagline -->
  <text x="258" y="222" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#bfe3cd">Self-hosted football data gateway</text>
</svg>
